name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  publish-appimage:
    name: Build and publish Linux AppImage
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      - name: Install Linux build and test dependencies
        timeout-minutes: 5
        run: |
          # Runner images can use the Azure mirror directly or through a mirror list.
          for source in /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
              if [ -f "$source" ]; then
                  sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g; s|https://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$source"
              fi
          done

          sudo tee /etc/apt/apt.conf.d/80-ci-network > /dev/null <<'EOF'
          Acquire::Retries "2";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          EOF

          sudo apt-get update -o APT::Update::Error-Mode=any
          sudo apt-get install --no-install-recommends -y dbus ffmpeg libasound2t64 libatk-bridge2.0-0 libgbm1 libgtk-3-0 libnss3 libxss1
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Check release version
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          bun -e 'if (process.env.RELEASE_TAG !== `v${require("./package.json").version}`) throw new Error("Release tag and package version differ")'

      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run knip
      - run: bun run test
      - run: bun run test:electron
      - run: bun run package:appimage:built
      - run: bun run test:appimage

      - name: Generate checksums
        working-directory: dist
        run: sha256sum BTunes-*-x86_64.AppImage > SHA256SUMS

      - name: Upload application and checksum
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/BTunes-*-x86_64.AppImage dist/SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"

      - name: Publish update metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/latest-linux.yml --clobber --repo "$GITHUB_REPOSITORY"
